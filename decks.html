<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loci — make your own deck</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 44rem; padding: 24px 16px 48px; background: #0b1220; color: #f2f6fb;
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { margin: 0 0 4px; }
  label { display: block; margin: 18px 0 6px; font-weight: 700; }
  input, textarea { width: 100%; padding: 12px; font: inherit; color: #f2f6fb; background: #0f1b2d;
    border: 2px solid #5ee6ff; border-radius: 10px; }
  textarea { min-height: 14rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; }
  button { margin-top: 18px; font: inherit; font-weight: 700; color: #06121c; background: #5ee6ff; border: 0;
    border-radius: 12px; padding: 12px 24px; min-height: 48px; cursor: pointer; }
  :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  #status { margin: 16px 0 6px; font-weight: 700; color: #ffd166; min-height: 1.5em; }
  #link { display: block; word-break: break-all; font-size: 0.85rem; color: #5ee6ff; }
  #copy { margin-top: 10px; }
  .small { font-size: 0.9rem; color: #c3d0df; }
</style>
</head>
<body>
<p><a href="index.html" style="color:#5ee6ff">← Back to Loci</a></p>
<h1>Make your own deck</h1>
<p class="small">One card per line, written as <b>question ; answer</b>. Up to 12 cards. Nothing is uploaded:
the deck travels inside the link itself.</p>

<label for="title">Deck name</label>
<input id="title" maxlength="40" value="My deck">

<label for="text">Cards</label>
<textarea id="text" spellcheck="false">Capital of Japan ; Tokyo
Capital of Canada ; Ottawa
Capital of Australia ; Canberra</textarea>

<button id="make">Make the link</button>
<p id="status" role="status" aria-live="polite"></p>
<a id="link" hidden></a>
<button id="copy" hidden>Copy link</button>

<script type="module">
import { parseText, makeDeck, encodeDeckParam, MAX_CARDS } from './src/decks.js';

const $ = id => document.getElementById(id);

$('make').onclick = () => {
  const found = parseText($('text').value);
  let deck;
  try {
    deck = makeDeck($('title').value, found);
  } catch (e) {
    $('status').textContent = 'No card found. Write each line as: question ; answer';
    $('link').hidden = $('copy').hidden = true;
    return;
  }
  const url = new URL('index.html', location.href);
  url.searchParams.set('deck', encodeDeckParam(deck));
  $('link').href = $('link').textContent = url.href;
  $('link').hidden = $('copy').hidden = false;
  const extra = found.length > MAX_CARDS ? ` (only the first ${MAX_CARDS} of ${found.length} lines are kept)` : '';
  $('status').textContent = `"${deck.title}": ${deck.cards.length} card${deck.cards.length === 1 ? '' : 's'}${extra}. Open or share this link:`;
};

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('link').href);
    $('copy').textContent = 'Copied';
  } catch {
    $('copy').textContent = 'Select the link and copy it';
  }
};
</script>
</body>
</html>
